</g><text x="748.667" y="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">16px</text><text x="592.6666666666667" y="636" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#161616">B · Copy</text><text x="592.6666666666667" y="670" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">The original is solid; the copy behind it</text><text x="592.6666666666667" y="696" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">is only an outline. Copies are temporary</text><text x="592.6666666666667" y="722" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">and get cleaned up.</text><rect x="1065.33" y="150" width="474.667" height="630" rx="18" fill="#fff" stroke="#e4e4e0" stroke-width="1"/><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="1095.33" y="190" width="414.667" height="300" preserveAspectRatio="xMidYMid meet"><path fill="#000" fill-rule="evenodd" d="M52 104 V42 A16 16 0 0 1 68 26 H188 A16 16 0 0 1 204 42 V104 Z M77 44 H97 A5 5 0 0 1 102 49 V63 A5 5 0 0 1 97 68 H77 A5 5 0 0 1 72 63 V49 A5 5 0 0 1 77 44 Z M38 116 H100 A28 28 0 0 0 156 116 H218 A10 10 0 0 1 228 126 V208 A22 22 0 0 1 206 230 H50 A22 22 0 0 1 28 208 V126 A10 10 0 0 1 38 116 Z"/></svg>
