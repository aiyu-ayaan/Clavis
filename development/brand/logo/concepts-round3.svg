</g><text x="246" y="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">16px</text><text x="90.0" y="636" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#161616">A · Masked</text><text x="90.0" y="664" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#161616" letter-spacing="1.5">RECOMMENDED</text><text x="90.0" y="698" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">A card that shows only its mask: four dots,</text><text x="90.0" y="724" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">nothing else. Private by default, exactly</text><text x="90.0" y="750" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">as the app shows it.</text><rect x="562.667" y="150" width="474.667" height="630" rx="18" fill="#fff" stroke="#e4e4e0" stroke-width="1"/><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="592.667" y="190" width="414.667" height="300" preserveAspectRatio="xMidYMid meet"><path fill="#000" fill-rule="evenodd" d="M42 88 H182 A18 18 0 0 1 200 106 V181 A18 18 0 0 1 182 199 H42 A18 18 0 0 1 24 181 V106 A18 18 0 0 1 42 88 Z M49 110 H69 A5 5 0 0 1 74 115 V129 A5 5 0 0 1 69 134 H49 A5 5 0 0 1 44 129 V115 A5 5 0 0 1 49 110 Z M56 76 V74 A18 18 0 0 1 74 56 H214 A18 18 0 0 1 232 74 V149 A18 18 0 0 1 214 167 H212 V153 H214 A4 4 0 0 0 218 149 V74 A4 4 0 0 0 214 70 H74 A4 4 0 0 0 70 74 V76 Z"/></svg>
